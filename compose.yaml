services:
  app:
    build: .
    restart: unless-stopped
    environment:
      TRADING_LAB_DATA_DIR: /data
      TRADING_LAB_ONLINE_MODE: "1"
    volumes:
      - app_data:/data
      - reference_docs:/app/reference_docs
    expose:
      - "8501"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  proxy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      TRADING_LAB_DOMAIN: ${TRADING_LAB_DOMAIN:?Configure o dominio antes de publicar}
      TRADING_LAB_TLS_EMAIL: ${TRADING_LAB_TLS_EMAIL:?Configure o email de TLS antes de publicar}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  app_data:
  reference_docs:
  caddy_data:
  caddy_config:
